file_params:
  plot_path: "./runs/demo/results/"
  results_path: "./runs/demo/results/"
  cat_path: "./data/Faraday/catalog_versions/"
  dm_path: "./data/Faraday/dispersion_measure/"
  auxiliary_path: "./data/Faraday/auxiliary/"
  #the keywords below define the full path of the file used for inference or creation of mock data
  fits_file_path: "data/Faraday/catalog_versions/"
  fits_file_root: "master_catalog_ver"
  fits_ext: ".fits"
  version: "custom"

params_inference:
  name: "demo"
  data_type: "mock" # mock or real
  seed: 2000
  nside: 256
  nglobal: 100
  n_samples_posterior: 100
  resume: False
  non_linear: False
  eta: False

sample_params:
  n: 2
  n_prior: 2
  n_final: 20
  increase_step: 8
  increase_rate: 1

controllers:
  sampler:
    n: 500
    n_final: 500
    increase_step:  "None"
    increase_rate:  "None"
    deltaE: 1.0e-07
    convergence_level: 2
  
  minimizer:
    n: 40
    n_final: 40
    increase_step: "None"
    increase_rate: "None"
    deltaE_threshold: 0
    deltaE_start: 1.0e-03
    deltaE_end: 1.0e-07
    convergence_level: 2 #sometimes better 2

  minimizer_samples:
    n: 25
    n_final: 80
    increase_step: "None"
    increase_rate: "None"
    deltaE: 1.0e-07
    convergence_level: 2

prior_parameters:

  galactic:
    #Sebastian
    log_amplitude:
      fluctuations:
        asperity: "None"
        flexibility: "1., 1."
        fluctuations: "1.0, 0.5"
        loglogavgslope: "-3.6667, 2."
      offset:
        offset_mean: 4.
        offset_std: "1., 1."
    sign:
      fluctuations:
        asperity: "None"
        flexibility: "1., 1."
        fluctuations: "5.0, 4.0"
        loglogavgslope: "-3.6667, 2."
      offset:
        offset_mean: 0.
        offset_std: "5., 4."

  extragalactic:
    prior_std:
      prior_std_int: 1.0
      prior_std_lum: 1.0
      prior_std_red: 1.0
      prior_std_env: 1.0

    prior_mean:
      prior_mean_int: 0.0
      prior_mean_lum: 0.0
      prior_mean_red: 0.0
      prior_mean_env: 0.0

params_mock_cat:

  power_spec:
    P0: 5.5
    k0: 5.0
    gamma: -8.0

  maker_params:
    use_mock: True
    disk_on: 1
    maker_type: "ymw16" #"seb23" #"consistent" #"ymw16"
    eg_on: True
    cat_gal:  "2023MNRAS.519.5723O" #"2025A&A...694A.125L" #"2023MNRAS.519.5723O" #"2009ApJ...702.1230T"
    cat_eg: "2023MNRAS.519.5723O" #"2025A&A...694A.125L" #"2023MNRAS.519.5723O" #"LoTSS DR2 (O'Sullivan et al. 2022)"
    gal_lat_th: 45.0 #45.0
    multiple: 0.25
    nvss: False
    base_catalog: "LoTSS_redshift_observed_catalog_1.2.0.fits"
        

    npi:
      use_npi: False
      npi_los: 5000
      #using Y. K. Ma et al. (2019)
      mu_nvss: 605.0
      sigma_nvss: 65.0
    
    surveys:
      
      #Survey1 should be used for eg and Survey2, if needed, for Galactic only. Otherwise Survey1 can be used for both
      make_survey1: False
      delta_low1: -90.0 #deg
      delta_high1: 0.0 #deg
      los1: 180000
      phi_low1: 0.0
      phi_high1: 2.0
      name1: 'SKA-MID'
      cat1: "2025A&A...694A.125L"  #"2023MNRAS.519.5723O"  #"2023MNRAS.519.5723O"  #"2025A&A...694A.125L"  #
     
      make_survey2: False
      delta_low2: -40.0 #deg
      delta_high2: 90.0 #deg
      los2: 37453
      phi_low2: 0.0
      phi_high2: 2.0
      name2: 'NVSS'
      cat2: "2009ApJ...702.1230T" #"2025A&A...694A.125L" #"2009ApJ...702.1230T" #"2025A&A...694A.125L" #

  mock_cat_initial_position: 

    std:
      std_int: 0.5
      std_lum: 0.5
      std_red: 0.5
      std_env: 0.5

    mean:
      mean_int: 2.0
      mean_lum: -0.5
      mean_red: -0.5
      mean_env: 3.0

plot:
  amplitude: 100
  bins: 10
  fontsize: 20
  markersize: 5
  legend_fontsize: 15
  map_nside: 64
